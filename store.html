<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Store — Looma Studio</title>
  <meta name="description" content="Buy ready-made Unity, Unreal Engine and Godot games with full source code from Looma Studio.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
  <link rel="icon" id="favicon" href="images/favicon.svg">
  <meta name="theme-color" content="#0b0d12">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/fx.css">
</head>
<body class="store-page">
<div id="site-header"></div>

<div class="cat-strip"><div class="container" id="catStrip"></div></div>

<div class="store-banner" style="position:relative;overflow:hidden">
  <div class="blob b1" style="width:360px;height:360px;top:-200px;left:-80px;opacity:.3"></div>
  <div class="blob b2" style="width:300px;height:300px;top:-160px;right:10%;bottom:auto;opacity:.25"></div>
  <div class="container" style="position:relative;z-index:2;display:flex;justify-content:space-between;align-items:end;gap:20px;flex-wrap:wrap">
    <div>
      <div class="breadcrumbs"><a href="index.html">Home</a> / Game Store</div>
      <h1 data-split style="margin-top:6px">Pre-made <span class="grad-text">Game Store</span></h1>
      <p data-reveal>Complete Unity, Unreal & Godot projects with full source code. Buy, reskin, publish.</p>
    </div>
    <div class="engine-pills" data-stagger style="margin:0">
      <span class="engine-pill">✔ Full source</span><span class="engine-pill">✔ Setup support</span><span class="engine-pill">✔ Offers welcome</span>
    </div>
  </div>
</div>

<main class="container store-layout">
  <aside class="filters" id="filters"></aside>
  <section>
    <div class="results-bar">
      <div style="display:flex;gap:10px;align-items:center">
        <button class="btn btn-sm btn-ghost filters-toggle" id="filtersToggle">☰ Filters</button>
        <span id="resultCount" class="muted"></span>
      </div>
      <label class="muted" style="font-size:.9rem">Sort by
        <select id="sortSel">
          <option value="featured">Featured</option>
          <option value="newest">Newest</option>
          <option value="price-asc">Price: low to high</option>
          <option value="price-desc">Price: high to low</option>
          <option value="name">Name A–Z</option>
        </select>
      </label>
    </div>
    <div class="active-chips" id="activeChips"></div>
    <div class="grid-products" id="productGrid"></div>
    <div class="pagination" id="pagination"></div>
  </section>
</main>

<div id="site-footer"></div>

<script src="js/layout.js"></script>
<script src="js/games.js"></script>
<script src="js/app.js"></script>
<script src="js/fx.js"></script>
<script src="js/store.js"></script>
</body>
</html>
